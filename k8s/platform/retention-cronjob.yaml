---
# Langfuse trace retention (48h). OSS carece de retención nativa (es EE-gated), así que
# un CronJob diario borra las trazas más antiguas que RETENTION_DAYS vía el API público.
# El borrado CASCADEA: elimina observations/scores en ClickHouse y los blobs S3 (MinIO).
# Idempotente: primero COLECTA todos los ids expirados (paginando por número de página),
# luego borra en lotes — evita el problema de borrar-mientras-paginas.
# Motivo PII: content-logging está ON → los mensajes de cliente viven en las trazas; cap 48h.
# (El otro store de PII, spend-logs de litellm, ya se auto-purga a 30d en su config.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-retention-script
  namespace: langfuse
data:
  retention.js: |
    const HOST = process.env.LANGFUSE_HOST || 'http://langfuse-web:3000';
    const DAYS = parseInt(process.env.RETENTION_DAYS || '2', 10);
    const DRY = process.env.DRY_RUN === 'true';
    const auth = 'Basic ' + Buffer.from(process.env.PK + ':' + process.env.SK).toString('base64');
    const H = { Authorization: auth, 'Content-Type': 'application/json' };
    const cutoff = new Date(Date.now() - DAYS * 86400000).toISOString();
    const MAX_PAGES = 2000; // tope de seguridad ~40k trazas/ejecución (2000×20)
    let operation = { stage: 'list', page: 0 };
    const redact = value => {
      let text = String(value);
      for (const secret of [process.env.PK, process.env.SK, auth, HOST]) {
        if (secret) text = text.split(secret).join('[REDACTED]');
      }
      return text
        .replace(/https?:\/\/\S+/gi, '[REDACTED_URL]')
        .replace(/\b[0-9a-f]{8}-[0-9a-f-]{27,}\b/gi, '[REDACTED_ID]')
        .replace(/\b[0-9a-f]{32,}\b/gi, '[REDACTED_ID]');
    };
    const errorDetails = e => {
      const details = {
        ...operation,
        name: redact(e && e.name || 'Error'),
        message: redact(e && e.message || 'Unknown fetch error'),
      };
      const cause = e && e.cause;
      if (cause && typeof cause === 'object') {
        details.cause = {};
        for (const key of ['code', 'errno', 'syscall', 'address', 'port']) {
          if (cause[key] !== undefined) details.cause[key] = redact(cause[key]);
        }
      }
      return details;
    };
    // SCOLD-639: el 16/17-09 el run diario murió en stage=list page=5 con
    // UND_ERR_SOCKET (reset transitorio del socket contra langfuse-web). Sin
    // retry, un solo reset tiraba toda la ejecución. Retry con backoff
    // exponencial para errores de red y 408/429/5xx; timeout por petición
    // para que un socket colgado no coma el activeDeadlineSeconds entero.
    // RETRIES=6 con backoff 2·2^n (2,4,8,16,32s ≈ 62s de espera acumulada):
    // medido el 18-09 — langfuse-web sufre OOMKills (exit 137, límite 2Gi) y
    // tarda ~2 min en volver a servir; con backoffs de ~8s totales el run
    // moraba igual. El borrado es idempotente, así que aguantar el reinicio
    // sale gratis. El OOM del web va en issue aparte.
    const RETRIES = 6;
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const fetchRetry = async (label, url, opts = {}) => {
      let lastErr;
      for (let attempt = 1; attempt <= RETRIES; attempt++) {
        try {
          const r = await fetch(url, { ...opts, signal: AbortSignal.timeout(30000) });
          if (r.ok || (r.status < 500 && r.status !== 429 && r.status !== 408)) return r;
          lastErr = Object.assign(new Error(`HTTP ${r.status}`), { name: 'FetchResponseError' });
        } catch (e) {
          lastErr = e;
        }
        if (attempt < RETRIES) {
          const backoff = Math.min(60000, 2000 * 2 ** (attempt - 1)) + Math.floor(Math.random() * 500);
          console.warn(`retry ${label} ${attempt}/${RETRIES}: ${redact(lastErr.message)}`);
          await sleep(backoff);
        }
      }
      throw lastErr;
    };
    (async () => {
      const ids = [];
      // limit=20, no 100: /api/public/traces devuelve el input/output COMPLETO
      // de cada traza (trazas de litellm = prompts enteros de varios MB). Medido
      // el 18-09: una página de 100 pinchaba +630 MiB en langfuse-web en 2 s
      // (471→1101 MiB) y, con la baseline de ~1 GiB que acumula el día, eso
      // cruzaba el límite de 2 Gi → OOMKill (exit 137) → el propio retention se
      // quedaba sin web a media paginación (UND_ERR_SOCKET en page=5 los días
      // 16 y 17-09). Con limit=20 el mismo query responde en 7 s sin pinchazo.
      for (let page = 1; page <= MAX_PAGES; page++) {
        operation = { stage: 'list', page };
        const r = await fetchRetry(`list page=${page}`, `${HOST}/api/public/traces?toTimestamp=${encodeURIComponent(cutoff)}&limit=20&page=${page}`, { headers: H });
        if (!r.ok) throw Object.assign(new Error(`HTTP ${r.status}`), { name: 'FetchResponseError' });
        const j = await r.json();
        const batch = (j.data || []).map(t => t.id);
        if (!batch.length) break;
        ids.push(...batch);
        if (page === MAX_PAGES) console.warn('MAX_PAGES cap alcanzado; quedan trazas para la próxima ejecución');
      }
      console.log(`cutoff=${cutoff} days=${DAYS} expired=${ids.length} dryRun=${DRY}`);
      if (DRY || !ids.length) { console.log('nada que borrar (dry o vacío)'); return; }
      let deleted = 0;
      for (let i = 0; i < ids.length; i += 100) {
        const chunk = ids.slice(i, i + 100);
        operation = { stage: 'delete', chunk: Math.floor(i / 100) + 1 };
        const d = await fetchRetry(`delete chunk=${Math.floor(i / 100) + 1}`, `${HOST}/api/public/traces`, { method: 'DELETE', headers: H, body: JSON.stringify({ traceIds: chunk }) });
        if (!d.ok) throw Object.assign(new Error(`HTTP ${d.status}`), { name: 'FetchResponseError' });
        deleted += chunk.length;
      }
      console.log(`retention done: deleted=${deleted}`);
    })().catch(e => { console.error('retention fetch failed', JSON.stringify(errorDetails(e))); process.exit(1); });
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: langfuse-retention
  namespace: langfuse
spec:
  schedule: "0 4 * * *"        # diario 04:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: retention        # coincide con la NetworkPolicy egress interna del ns
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: retention
              image: langfuse/langfuse:3.205.1   # trae node20 (global fetch); script solo usa built-ins
              command: ["node", "/scripts/retention.js"]
              env:
                - name: LANGFUSE_HOST
                  value: "http://langfuse-web:3000"
                - name: RETENTION_DAYS
                  value: "2"
                - name: PK
                  valueFrom: { secretKeyRef: { name: langfuse-secrets, key: init-project-public-key } }
                - name: SK
                  valueFrom: { secretKeyRef: { name: langfuse-secrets, key: init-project-secret-key } }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: langfuse-retention-script
---
# Langfuse migrations own these tables and may replace their DDL. Re-apply the
# 48-hour TTL daily so a chart/app upgrade cannot silently restore unlimited
# history. The API retention job above remains responsible for cascade deletion
# of associated object-store blobs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-clickhouse-retention-sql
  namespace: langfuse
data:
  retention.sql: |
    -- materialize_ttl_after_modify=0: por defecto ClickHouse re-materializa
    -- TODAS las partes en cada MODIFY TTL, aunque el TTL no haya cambiado. Como
    -- este job re-declara los mismos 16 TTL cada noche, eso son 16 mutaciones
    -- completas diarias para nada. El 21-08-2026 la de system.metric_log (~1000
    -- columnas) se comio el limite de 7,20 GiB del servidor:
    --   Code: 341 ... reason: Code: 241 (total) memory limit exceeded
    -- y dejo a ClickHouse tan ahogado que media hora despues langfuse-retention
    -- moria con UND_ERR_SOCKET al paginar /api/public/traces. Dos tarjetas rojas,
    -- un solo origen. Con el SET, declarar un TTL que ya esta puesto es solo
    -- metadato: 0 mutaciones nuevas (medido). El borrado real lo sigue haciendo
    -- ClickHouse en los merges de fondo, que es como funciona TTL.
    SET materialize_ttl_after_modify = 0;
    ALTER TABLE default.observations MODIFY TTL toDateTime(start_time) + toIntervalHour(48);
    ALTER TABLE default.traces MODIFY TTL toDateTime(timestamp) + toIntervalHour(48);
    ALTER TABLE default.scores MODIFY TTL toDateTime(timestamp) + toIntervalHour(48);
    ALTER TABLE default.blob_storage_file_log MODIFY TTL toDateTime(created_at) + toIntervalHour(48);
    ALTER TABLE default.dataset_run_items MODIFY TTL toDateTime(created_at) + toIntervalHour(48);
    ALTER TABLE default.dataset_run_items_rmt MODIFY TTL toDateTime(created_at) + toIntervalHour(48);
    ALTER TABLE default.event_log MODIFY TTL toDateTime(created_at) + toIntervalHour(48);
    ALTER TABLE system.asynchronous_metric_log MODIFY TTL event_date + toIntervalDay(2);
    ALTER TABLE system.error_log MODIFY TTL event_date + toIntervalDay(2);
    ALTER TABLE system.metric_log MODIFY TTL event_date + toIntervalDay(2);
    ALTER TABLE system.opentelemetry_span_log MODIFY TTL finish_date + toIntervalDay(2);
    ALTER TABLE system.part_log MODIFY TTL event_date + toIntervalDay(2);
    ALTER TABLE system.processors_profile_log MODIFY TTL event_date + toIntervalDay(2);
    ALTER TABLE system.query_log MODIFY TTL event_date + toIntervalDay(2);
    ALTER TABLE system.text_log MODIFY TTL event_date + toIntervalDay(2);
    ALTER TABLE system.trace_log MODIFY TTL event_date + toIntervalDay(2);
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: langfuse-clickhouse-retention
  namespace: langfuse
spec:
  schedule: "30 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: retention
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: clickhouse-retention
              image: docker.io/bitnamilegacy/clickhouse:25.2.1-debian-12-r0
              command: ["/bin/bash", "-ec"]
              args:
                - >-
                  clickhouse-client
                  --host langfuse-clickhouse
                  --user "$CLICKHOUSE_USER"
                  --password "$CLICKHOUSE_PASSWORD"
                  --multiquery < /scripts/retention.sql
              env:
                - name: CLICKHOUSE_USER
                  value: "default"
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-secrets
                      key: clickhouse-password
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: langfuse-clickhouse-retention-sql
