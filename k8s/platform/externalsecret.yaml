# Langfuse app secrets, materialised from 1Password via External Secrets Operator.
# Store:  ClusterSecretStore `onepassword`  (vault `k8s-pocharlies`)
# Item:   langfuse   (flat, one field per key — same convention as the litellm item)
#
# Seed the 1Password item BEFORE first sync (see README §Secretos):
#   op item edit langfuse --vault=k8s-pocharlies \
#     SALT=...  ENCRYPTION_KEY=...  NEXTAUTH_SECRET=... \
#     DB_USER=langfuse  DB_PASSWORD=...  REDIS_PASSWORD=...  CLICKHOUSE_PASSWORD=... \
#     S3_ACCESS_KEY_ID=...  S3_SECRET_ACCESS_KEY=... \
#     INIT_PROJECT_PUBLIC_KEY=pk-lf-...  INIT_PROJECT_SECRET_KEY=sk-lf-... \
#     INIT_USER_EMAIL=me@e-dani.com  INIT_USER_PASSWORD=...
#
# sync-wave -5: create the Secret before the chart's web/worker pods start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: langfuse-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: salt
      remoteRef: { key: langfuse/SALT }
    - secretKey: encryption-key
      remoteRef: { key: langfuse/ENCRYPTION_KEY }
    - secretKey: nextauth-secret
      remoteRef: { key: langfuse/NEXTAUTH_SECRET }
    - secretKey: postgres-password
      remoteRef: { key: langfuse/DB_PASSWORD }
    - secretKey: redis-password
      remoteRef: { key: langfuse/REDIS_PASSWORD }
    - secretKey: clickhouse-password
      remoteRef: { key: langfuse/CLICKHOUSE_PASSWORD }
    - secretKey: s3-access-key-id
      remoteRef: { key: langfuse/S3_ACCESS_KEY_ID }
    - secretKey: s3-secret-access-key
      remoteRef: { key: langfuse/S3_SECRET_ACCESS_KEY }
    - secretKey: init-project-public-key
      remoteRef: { key: langfuse/INIT_PROJECT_PUBLIC_KEY }
    - secretKey: init-project-secret-key
      remoteRef: { key: langfuse/INIT_PROJECT_SECRET_KEY }
    - secretKey: init-user-email
      remoteRef: { key: langfuse/INIT_USER_EMAIL }
    - secretKey: init-user-password
      remoteRef: { key: langfuse/INIT_USER_PASSWORD }
    - secretKey: keycloak-client-secret
      remoteRef: { key: langfuse/KEYCLOAK_CLIENT_SECRET }
