# Langfuse app secrets, materialised from 1Password via External Secrets Operator.
# Store:  ClusterSecretStore `onepassword-connect`  (vault `k8s-pocharlies`), el de la casa: Connect
#         dentro del cluster. Las claves van pues en forma Connect — `key: <item>` + `property: <campo>`
#         —, NO `key: item/CAMPO`, que es la forma del store SDK `onepassword` y con Connect se cae con
#         "key not found in 1Password Vaults" (INFRA-1175, 07-11: se cambió el store sin cambiar la forma).
# Item:   langfuse   (flat, one field per key — same convention as the litellm item)
#
# Seed the 1Password item BEFORE first sync (see README §Secretos):
#   op item edit langfuse --vault=k8s-pocharlies \
#     SALT=...  ENCRYPTION_KEY=...  NEXTAUTH_SECRET=... \
#     DB_USER=langfuse  DB_PASSWORD=...  REDIS_PASSWORD=...  CLICKHOUSE_PASSWORD=... \
#     (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY dejan de leerse desde INFRA-1175: las
#      credenciales de blob vienen de platform/ovh-creds.yaml, item `ovh-object-storage-s3`)
#     INIT_PROJECT_PUBLIC_KEY=pk-lf-...  INIT_PROJECT_SECRET_KEY=sk-lf-... \
#     INIT_USER_EMAIL=me@e-dani.com  INIT_USER_PASSWORD=...
#
# sync-wave -5: create the Secret before the chart's web/worker pods start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: langfuse-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: salt
      remoteRef: { key: langfuse, property: SALT }
    - secretKey: encryption-key
      remoteRef: { key: langfuse, property: ENCRYPTION_KEY }
    - secretKey: nextauth-secret
      remoteRef: { key: langfuse, property: NEXTAUTH_SECRET }
    - secretKey: postgres-password
      remoteRef: { key: langfuse, property: DB_PASSWORD }
    - secretKey: redis-password
      remoteRef: { key: langfuse, property: REDIS_PASSWORD }
    - secretKey: clickhouse-password
      remoteRef: { key: langfuse, property: CLICKHOUSE_PASSWORD }
    - secretKey: init-project-public-key
      remoteRef: { key: langfuse, property: INIT_PROJECT_PUBLIC_KEY }
    - secretKey: init-project-secret-key
      remoteRef: { key: langfuse, property: INIT_PROJECT_SECRET_KEY }
    - secretKey: init-user-email
      remoteRef: { key: langfuse, property: INIT_USER_EMAIL }
    - secretKey: init-user-password
      remoteRef: { key: langfuse, property: INIT_USER_PASSWORD }
    - secretKey: keycloak-client-secret
      remoteRef: { key: langfuse, property: KEYCLOAK_CLIENT_SECRET }
